<title>INT</title>
<h1>INT</h1>
<p>Rounds a number down to the nearest whole number (toward minus infinity).</p>
<h2>Syntax</h2>
<pre>INT(number)</pre>
<h2>Examples</h2>
<code>
10 PRINT INT(3.9)    : REM 3
20 PRINT INT(-1.2)   : REM -2
</code>
