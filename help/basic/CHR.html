<title>CHR$</title>
<h1>CHR$</h1>
<p>Returns the one-character string for a character code.</p>
<h2>Syntax</h2>
<pre>CHR$(code)</pre>
<h2>Examples</h2>
<code>
10 PRINT CHR$(65)     : REM A
20 PRINT CHR$(9)      : REM a tab
</code>
