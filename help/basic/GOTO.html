<title>GOTO</title>
<h1>GOTO</h1>
<p>Jumps to a line number.</p>
<h2>Syntax</h2>
<pre>GOTO line</pre>
<h2>Description</h2>
<p>Transfers control to the given line and carries on from there. Structured
loops and <a href="PROC">PROC</a>s are usually clearer, but GOTO is available for
classic-style programs.</p>
<h2>Examples</h2>
<code>
10 PRINT "forever"
20 GOTO 10
</code>
