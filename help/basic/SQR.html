<title>SQR</title>
<h1>SQR</h1>
<p>Returns the square root of a number.</p>
<h2>Syntax</h2>
<pre>SQR(number)</pre>
<h2>Examples</h2>
<code>
10 PRINT SQR(2)      : REM 1.41421356
20 PRINT SQR(144)    : REM 12
</code>
