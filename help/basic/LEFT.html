<title>LEFT$</title>
<h1>LEFT$</h1>
<p>Returns the leftmost characters of a string.</p>
<h2>Syntax</h2>
<pre>LEFT$(string$, n)</pre>
<h2>Description</h2>
<p>Yields the first <b>n</b> characters of the string. If <b>n</b> is larger than
the string, the whole string is returned.</p>
<h2>Examples</h2>
<code>
10 PRINT LEFT$("hedgehog", 4)    : REM hedg
</code>
