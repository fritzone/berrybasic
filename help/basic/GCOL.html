<title>GCOL</title>
<h1>GCOL</h1>
<p>Sets the graphics drawing colour.</p>
<h2>Syntax</h2>
<pre>GCOL colour</pre>
<h2>Description</h2>
<p>Sets the colour used by the drawing commands (<a href="PLOT">PLOT</a>,
<a href="DRAW">DRAW</a>, <a href="CIRCLE">CIRCLE</a>, ...). Logical colours are
0-7 as for <a href="COLOUR">COLOUR</a>.</p>
<h2>Examples</h2>
<code>
10 GCOL 2 : CIRCLE 640, 512, 200
</code>
<h2>See also</h2>
<p><a href="COLOUR">COLOUR</a>, <a href="PLOT">PLOT</a>, <a href="INDEX">Index</a></p>
