<title>RIGHT$</title>
<h1>RIGHT$</h1>
<p>Returns the rightmost characters of a string.</p>
<h2>Syntax</h2>
<pre>RIGHT$(string$, n)</pre>
<h2>Examples</h2>
<code>
10 PRINT RIGHT$("hedgehog", 3)   : REM hog
</code>
