<title>LEN</title>
<h1>LEN</h1>
<p>Returns the number of characters in a string.</p>
<h2>Syntax</h2>
<pre>LEN(string$)</pre>
<h2>Examples</h2>
<code>
10 s$ = "BerryBasiC"
20 PRINT LEN(s$)      : REM prints 10
</code>
