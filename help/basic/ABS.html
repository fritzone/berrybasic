<title>ABS</title>
<h1>ABS</h1>
<p>Returns the absolute (non-negative) value of a number.</p>
<h2>Syntax</h2>
<pre>ABS(number)</pre>
<h2>Examples</h2>
<code>
10 PRINT ABS(-7)     : REM 7
20 PRINT ABS(3.5)    : REM 3.5
</code>
